services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      PORT: 4020
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5174,capacitor://localhost,http://localhost}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5174}
      DATABASE_URL: ${DATABASE_URL:-postgresql://fame_market:fame_market@postgres:5432/fame_market}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      AUTO_MIGRATE: "true"
      AUTH_MODE: ${AUTH_MODE:-development}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_SYNC_ENABLED: ${YOUTUBE_SYNC_ENABLED:-false}
      YOUTUBE_SYNC_INTERVAL_MINUTES: ${YOUTUBE_SYNC_INTERVAL_MINUTES:-60}
      ATTENTION_SYNC_ENABLED: ${ATTENTION_SYNC_ENABLED:-false}
      ATTENTION_SYNC_INTERVAL_MINUTES: ${ATTENTION_SYNC_INTERVAL_MINUTES:-360}
      ATTENTION_USER_AGENT: ${ATTENTION_USER_AGENT:-FamePlays/0.1}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      NEWS_SYNC_INTERVAL_MINUTES: ${NEWS_SYNC_INTERVAL_MINUTES:-120}
      NEWS_SYNC_CONCURRENCY: ${NEWS_SYNC_CONCURRENCY:-3}
      NEWS_GDELT_MIN_INTERVAL_MS: ${NEWS_GDELT_MIN_INTERVAL_MS:-6000}
      NEWS_SIGNAL_MODE: ${NEWS_SIGNAL_MODE:-shadow}
      NEWS_PRICE_IMPACT_ENABLED: ${NEWS_PRICE_IMPACT_ENABLED:-false}
      NEWS_MAX_SIGNAL_BPS: ${NEWS_MAX_SIGNAL_BPS:-250}
      NEWS_MAX_DAILY_BPS: ${NEWS_MAX_DAILY_BPS:-400}
      NEWS_TOTAL_PRICE_BAND_BPS: ${NEWS_TOTAL_PRICE_BAND_BPS:-800}
      MARKET_MAKER_ENABLED: ${MARKET_MAKER_ENABLED:-false}
      MARKET_MAKER_INTERVAL_MINUTES: ${MARKET_MAKER_INTERVAL_MINUTES:-15}
      MARKET_MAKER_MIN_TICK_MINUTES: ${MARKET_MAKER_MIN_TICK_MINUTES:-10}
      MARKET_MAKER_PRICE_BAND_BPS: ${MARKET_MAKER_PRICE_BAND_BPS:-1000}
      MARKET_MAKER_MAX_TICK_BPS: ${MARKET_MAKER_MAX_TICK_BPS:-90}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      CONSENT_REQUIRED: ${CONSENT_REQUIRED:-false}
      RIGHTS_CONTACT_EMAIL: ${RIGHTS_CONTACT_EMAIL:-}
      RIGHTS_IP_HASH_SALT: ${RIGHTS_IP_HASH_SALT:-development-only}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-sebas7240@gmail.com}
      MONITORING_SECRET: ${MONITORING_SECRET:-change-monitoring-secret}
      CHAT_WORKER_ADMIN_URL: ${CHAT_WORKER_ADMIN_URL:-}
      CHAT_ADMIN_SECRET: ${CHAT_ADMIN_SECRET:-}
      PRESENCE_HASH_SALT: ${PRESENCE_HASH_SALT:-development-only}
      SEASON_AUTOMATION_ENABLED: ${SEASON_AUTOMATION_ENABLED:-true}
      SEASON_CYCLE_INTERVAL_MINUTES: ${SEASON_CYCLE_INTERVAL_MINUTES:-5}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-7}
      SEASON_FREEZE_MINUTES: ${SEASON_FREEZE_MINUTES:-30}
      SEASON_STARTING_BALANCE: ${SEASON_STARTING_BALANCE:-10000}
    ports:
      - "4020:4020"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4020/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fame_market}
      POSTGRES_USER: ${POSTGRES_USER:-fame_market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fame_market}
    ports:
      - "5434:5432"
    volumes:
      - fame_market_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fame_market -d fame_market"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-fame_market}
      PGUSER: ${POSTGRES_USER:-fame_market}
      PGPASSWORD: ${POSTGRES_PASSWORD:-fame_market}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
      ALLOW_UNENCRYPTED_BACKUP: ${ALLOW_UNENCRYPTED_BACKUP:-false}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fame_market_postgres:
