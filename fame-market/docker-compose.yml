services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-development}
      PORT: 4020
      FRONTEND_ORIGINS: http://localhost:5174,capacitor://localhost,http://localhost
      DATABASE_URL: postgresql://fame_market:fame_market@postgres:5432/fame_market
      AUTO_MIGRATE: "true"
      AUTH_MODE: ${AUTH_MODE:-development}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      CONSENT_REQUIRED: ${CONSENT_REQUIRED:-false}
      ADMIN_SECRET: ${ADMIN_SECRET:-change-me}
      MONITORING_SECRET: ${MONITORING_SECRET:-change-monitoring-secret}
      SEASON_AUTOMATION_ENABLED: ${SEASON_AUTOMATION_ENABLED:-true}
      SEASON_CYCLE_INTERVAL_MINUTES: ${SEASON_CYCLE_INTERVAL_MINUTES:-5}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-7}
      SEASON_FREEZE_MINUTES: ${SEASON_FREEZE_MINUTES:-30}
      SEASON_STARTING_BALANCE: ${SEASON_STARTING_BALANCE:-10000}
    ports:
      - "4020:4020"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4020/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fame_market
      POSTGRES_USER: fame_market
      POSTGRES_PASSWORD: fame_market
    ports:
      - "5434:5432"
    volumes:
      - fame_market_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fame_market -d fame_market"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    build:
      context: .
      dockerfile: ops/Dockerfile.backup
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: fame_market
      PGUSER: fame_market
      PGPASSWORD: fame_market
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
      ALLOW_UNENCRYPTED_BACKUP: ${ALLOW_UNENCRYPTED_BACKUP:-false}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-auto}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  fame_market_postgres:
