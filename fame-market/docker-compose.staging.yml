name: fame-market-staging

services:
  api-staging:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4020
      DEPLOYMENT_ENV: staging
      FRONTEND_ORIGINS: ${STAGING_FRONTEND_ORIGINS:?Set STAGING_FRONTEND_ORIGINS}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?Set PUBLIC_SITE_URL}
      DATABASE_URL: postgresql://fame_market_staging:${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}@postgres-staging:5432/fame_market_staging
      DATABASE_SSL: "false"
      AUTO_MIGRATE: "true"
      AUTH_MODE: firebase
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      YOUTUBE_SYNC_ENABLED: ${YOUTUBE_SYNC_ENABLED:-false}
      YOUTUBE_SYNC_INTERVAL_MINUTES: ${YOUTUBE_SYNC_INTERVAL_MINUTES:-60}
      ATTENTION_SYNC_ENABLED: ${ATTENTION_SYNC_ENABLED:-false}
      ATTENTION_SYNC_INTERVAL_MINUTES: ${ATTENTION_SYNC_INTERVAL_MINUTES:-360}
      ATTENTION_USER_AGENT: ${ATTENTION_USER_AGENT:-FamePlays/0.1}
      NEWS_SYNC_ENABLED: ${NEWS_SYNC_ENABLED:-false}
      NEWS_SYNC_INTERVAL_MINUTES: ${NEWS_SYNC_INTERVAL_MINUTES:-120}
      NEWS_SYNC_CONCURRENCY: ${NEWS_SYNC_CONCURRENCY:-2}
      NEWS_GDELT_MIN_INTERVAL_MS: ${NEWS_GDELT_MIN_INTERVAL_MS:-6000}
      NEWS_SIGNAL_MODE: ${NEWS_SIGNAL_MODE:-shadow}
      NEWS_PRICE_IMPACT_ENABLED: ${NEWS_PRICE_IMPACT_ENABLED:-false}
      NEWS_MAX_SIGNAL_BPS: ${NEWS_MAX_SIGNAL_BPS:-250}
      NEWS_MAX_DAILY_BPS: ${NEWS_MAX_DAILY_BPS:-400}
      NEWS_TOTAL_PRICE_BAND_BPS: ${NEWS_TOTAL_PRICE_BAND_BPS:-800}
      MARKET_MAKER_ENABLED: ${MARKET_MAKER_ENABLED:-false}
      MARKET_MAKER_INTERVAL_MINUTES: ${MARKET_MAKER_INTERVAL_MINUTES:-15}
      MARKET_MAKER_MIN_TICK_MINUTES: ${MARKET_MAKER_MIN_TICK_MINUTES:-10}
      MARKET_MAKER_PRICE_BAND_BPS: ${MARKET_MAKER_PRICE_BAND_BPS:-1000}
      MARKET_MAKER_MAX_TICK_BPS: ${MARKET_MAKER_MAX_TICK_BPS:-90}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_ALLOWED_HOSTNAMES: ${TURNSTILE_ALLOWED_HOSTNAMES:-}
      CONSENT_REQUIRED: "true"
      RIGHTS_CONTACT_EMAIL: ${RIGHTS_CONTACT_EMAIL:-}
      RIGHTS_IP_HASH_SALT: ${RIGHTS_IP_HASH_SALT:?Set RIGHTS_IP_HASH_SALT}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-sebas7240@gmail.com}
      MONITORING_SECRET: ${MONITORING_SECRET:?Set MONITORING_SECRET}
      CHAT_WORKER_ADMIN_URL: ${CHAT_WORKER_ADMIN_URL:?Set CHAT_WORKER_ADMIN_URL}
      CHAT_ADMIN_SECRET: ${CHAT_ADMIN_SECRET:?Set CHAT_ADMIN_SECRET}
      PRESENCE_HASH_SALT: ${PRESENCE_HASH_SALT:?Set PRESENCE_HASH_SALT}
      SEASON_AUTOMATION_ENABLED: ${SEASON_AUTOMATION_ENABLED:-true}
      SEASON_CYCLE_INTERVAL_MINUTES: ${SEASON_CYCLE_INTERVAL_MINUTES:-5}
      SEASON_LENGTH_DAYS: ${SEASON_LENGTH_DAYS:-7}
      SEASON_FREEZE_MINUTES: ${SEASON_FREEZE_MINUTES:-30}
      SEASON_STARTING_BALANCE: ${SEASON_STARTING_BALANCE:-10000}
    ports:
      - "127.0.0.1:4021:4020"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4020/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres-staging:
        condition: service_healthy

  postgres-staging:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fame_market_staging
      POSTGRES_USER: fame_market_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?Set STAGING_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - fame_market_staging_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U fame_market_staging -d fame_market_staging"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fame_market_staging_postgres:
