worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 30s;
  keepalive_requests 1000;
  server_tokens off;

  proxy_cache_path /var/cache/nginx/golea-segments
    levels=1:2
    keys_zone=golea_segments:128m
    max_size=20g
    inactive=6h
    use_temp_path=off;

  upstream golea_backend {
    server backend:3001;
    keepalive 64;
  }

  server {
    listen 8080;

    location = /health {
      proxy_pass http://golea_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Golea-Microcache BYPASS always;
    }

    location /api/proxy/segment {
      proxy_pass http://golea_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering on;
      proxy_cache golea_segments;
      proxy_cache_key "$scheme|$host|$request_uri";
      proxy_cache_lock on;
      proxy_cache_lock_timeout 15s;
      proxy_cache_lock_age 30s;
      proxy_cache_valid 200 206 6h;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;

      add_header X-Golea-Microcache $upstream_cache_status always;
    }

    location / {
      proxy_pass http://golea_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      add_header X-Golea-Microcache BYPASS always;
    }
  }
}
