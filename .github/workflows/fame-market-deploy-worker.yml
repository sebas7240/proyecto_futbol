name: Deploy Fame Plays Chat Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fame-market/chat-worker/**"
      - ".github/workflows/fame-market-deploy-worker.yml"

permissions:
  contents: read

concurrency:
  group: fame-plays-chat-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: fame-plays-production
    defaults:
      run:
        working-directory: fame-market
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHAT_ADMIN_SECRET: ${{ secrets.CHAT_ADMIN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Sync chat admin secret
        if: env.CHAT_ADMIN_SECRET != ''
        shell: bash
        run: |
          printf '%s' "$CHAT_ADMIN_SECRET" | \
            npx --yes wrangler@4.100.0 secret put CHAT_ADMIN_SECRET --config chat-worker/wrangler.jsonc

      - name: Deploy Durable Object Worker
        run: npx --yes wrangler@4.100.0 deploy --config chat-worker/wrangler.jsonc

      - name: Verify Worker health
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            https://fame-plays-chat.sebas7240.workers.dev/health
