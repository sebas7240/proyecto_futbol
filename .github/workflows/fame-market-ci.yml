name: Fame Plays CI

on:
  pull_request:
    paths:
      - "fame-market/**"
      - ".github/workflows/fame-market-*.yml"
  push:
    branches: [main]
    paths:
      - "fame-market/**"
      - ".github/workflows/fame-market-*.yml"

permissions:
  contents: read

concurrency:
  group: fame-plays-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fame-market

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fame-market/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build backend and frontend
        run: npm run build

      - name: Run backend tests
        run: npm test

      - name: Validate Chat Worker syntax
        run: node --check chat-worker/src/index.js
