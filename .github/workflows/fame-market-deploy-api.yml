name: Deploy Fame Plays API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fame-market/backend/**"
      - "fame-market/docker-compose.yml"
      - "fame-market/package.json"
      - "fame-market/package-lock.json"
      - ".github/workflows/fame-market-deploy-api.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: fame-plays-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fame-plays-production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
      CHAT_ADMIN_SECRET: ${{ secrets.CHAT_ADMIN_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS VPS_DEPLOY_PATH; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [[ "$VPS_SSH_PRIVATE_KEY" == *"BEGIN OPENSSH PRIVATE KEY"* ]]; then
            printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/fame_plays_deploy
          else
            printf '%s' "$VPS_SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/fame_plays_deploy
          fi
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/fame_plays_deploy ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/fame_plays_deploy >/dev/null

      - name: Deploy API on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/fame_plays_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_DEPLOY_PATH" "$GITHUB_SHA" "$CHAT_ADMIN_SECRET" <<'REMOTE'
          set -Eeuo pipefail
          DEPLOY_PATH="$1"
          EXPECTED_SHA="$2"
          CHAT_SECRET_FROM_GH="${3:-}"

          cd "$DEPLOY_PATH"
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "The VPS repository has tracked local changes; deployment stopped."
            exit 1
          fi

          git fetch origin main
          git checkout main
          git merge --ff-only "$EXPECTED_SHA"

          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo "The checked out commit does not match the workflow commit."
            exit 1
          fi

          cd fame-market
          test -f .env || { echo "fame-market/.env is missing"; exit 1; }

          set_env_value() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              escaped_value="${value//\\/\\\\}"
              escaped_value="${escaped_value//&/\\&}"
              escaped_value="${escaped_value//|/\\|}"
              sed -i "s|^${key}=.*|${key}=${escaped_value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }
          set_env_value DEPLOYMENT_ENV production
          set_env_value AUTH_MODE firebase
          set_env_value CHAT_WORKER_ADMIN_URL https://fame-plays-chat.sebas7240.workers.dev
          if [[ -n "$CHAT_SECRET_FROM_GH" ]]; then
            set_env_value CHAT_ADMIN_SECRET "$CHAT_SECRET_FROM_GH"
          fi
          if ! grep -Eq '^CHAT_ADMIN_SECRET=.+$' .env; then
            echo "CHAT_ADMIN_SECRET is missing. Add the GitHub secret or set it in fame-market/.env."
            exit 1
          fi
          if ! grep -Eq '^MONITORING_SECRET=.+$' .env || grep -Eq '^MONITORING_SECRET=change-monitoring-secret$' .env; then
            set_env_value MONITORING_SECRET "$(openssl rand -hex 32)"
          fi
          if ! grep -Eq '^PRESENCE_HASH_SALT=.+$' .env || grep -Eq '^PRESENCE_HASH_SALT=(change-me|development-only)$' .env; then
            set_env_value PRESENCE_HASH_SALT "$(openssl rand -hex 32)"
          fi
          set_env_value NEWS_SIGNAL_MODE applied
          set_env_value NEWS_PRICE_IMPACT_ENABLED true
          set_env_value NEWS_MAX_SIGNAL_BPS 250
          set_env_value NEWS_MAX_DAILY_BPS 400
          set_env_value NEWS_TOTAL_PRICE_BAND_BPS 800
          set_env_value MARKET_MAKER_ENABLED true
          set_env_value MARKET_MAKER_INTERVAL_MINUTES 15
          set_env_value MARKET_MAKER_MIN_TICK_MINUTES 10
          set_env_value MARKET_MAKER_PRICE_BAND_BPS 1000
          set_env_value MARKET_MAKER_MAX_TICK_BPS 90
          set_env_value MARKET_MAKER_MEAN_REVERSION_BPS 34
          set_env_value MARKET_MAKER_BALANCE_NOISE_BPS 22
          set_env_value MARKET_MAKER_OVERHEAT_THRESHOLD_BPS 430
          set_env_value MARKET_MAKER_OVERHEAT_COOLDOWN_BPS 58

          docker compose -p fameplays --env-file .env config --quiet
          docker compose -p fameplays --env-file .env up --build -d

          for attempt in {1..12}; do
            if curl --fail --silent http://127.0.0.1:4020/api/health/ready >/dev/null; then
              docker compose -p fameplays --env-file .env ps
              exit 0
            fi
            sleep 5
          done

          docker compose -p fameplays --env-file .env logs --tail=100 api
          echo "Fame Plays API did not become ready."
          exit 1
          REMOTE

      - name: Report deployment result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          gh issue comment 4 \
            --repo "${{ github.repository }}" \
            --body "Fame Plays API deployment: **${DEPLOY_STATUS}** | commit \`${GITHUB_SHA}\` | [ver ejecucion](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
