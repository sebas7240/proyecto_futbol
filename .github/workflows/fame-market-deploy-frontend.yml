name: Deploy Fame Plays Frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fame-market/frontend/**"
      - "fame-market/package.json"
      - "fame-market/package-lock.json"
      - ".github/workflows/fame-market-deploy-frontend.yml"

permissions:
  contents: read

concurrency:
  group: fame-plays-frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: fame-plays-production
    defaults:
      run:
        working-directory: fame-market
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fame-market/package-lock.json

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Write production frontend env
        shell: bash
        run: |
          cat > frontend/.env.production <<'EOF'
          VITE_APP_ENV=production
          VITE_API_BASE=https://api.fameplays.com/api
          VITE_PUBLIC_SITE_URL=https://fameplays.com
          VITE_CHAT_WS_URL=https://fame-plays-chat.sebas7240.workers.dev
          VITE_CHAT_VOICE_ENABLED=true
          VITE_TURNSTILE_SITE_KEY=0x4AAAAAADnalZgQE_SkEYDp
          VITE_ADMIN_EMAILS=sebas7240@gmail.com
          VITE_FIREBASE_API_KEY=AIzaSyDNQtgtE0ttJVVKBOzmYN559ktzUAIfCh8
          VITE_FIREBASE_AUTH_DOMAIN=fameplays-b2cfb.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID=fameplays-b2cfb
          VITE_FIREBASE_STORAGE_BUCKET=fameplays-b2cfb.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID=94103317869
          VITE_FIREBASE_APP_ID=1:94103317869:web:5b80f69ca998aecd4dbe64
          EOF

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Deploy Cloudflare Pages
        run: npx --yes wrangler@4.100.0 pages deploy frontend/dist --project-name fameplays --branch main

      - name: Verify public page
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 5 --retry-all-errors \
            https://www.fameplays.com/ > /tmp/fameplays.html
          grep -q "assets/index-" /tmp/fameplays.html
