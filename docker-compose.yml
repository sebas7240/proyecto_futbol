version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PROXY_TOKEN_SECRET=${PROXY_TOKEN_SECRET:-}
      - VIDEO_TOKEN_TTL_MS=${VIDEO_TOKEN_TTL_MS:-21600000}
    restart: always

  # Note: Frontend is usually deployed to Cloudflare Pages as discussed,
  # but this compose file is useful for local production testing.
