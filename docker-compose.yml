version: '3.8'

# Note: Frontend is usually deployed to Cloudflare Pages as discussed,
# but this compose file is useful for local production testing.
services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PROXY_TOKEN_SECRET=${PROXY_TOKEN_SECRET:-}
      - VIDEO_TOKEN_TTL_MS=${VIDEO_TOKEN_TTL_MS:-21600000}
      - PROXY_RATE_LIMIT_MAX=${PROXY_RATE_LIMIT_MAX:-60000}
      - EDGE_PROXY_BASE_URL=${EDGE_PROXY_BASE_URL:-}
      - IPTV_ONLY_MODE=${IPTV_ONLY_MODE:-true}
      - IPTV_CHANNELS_FILE=/data/iptv_active_channels.json
    volumes:
      - ./iptv_active_channels.json:/data/iptv_active_channels.json:ro
    restart: always

  microcache:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-cache:/var/cache/nginx
    restart: always

volumes:
  nginx-cache:
